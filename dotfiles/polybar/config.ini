; =============================================================================
; Polybar Minimalist Configuration
; =============================================================================

[colors]
background = #111111
background-alt = #222222
foreground = #ffffff
foreground-alt = #888888
primary = #ffffff
secondary = #555555
alert = #900000

[bar/main]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

padding-left = 1
padding-right = 2

module-margin = 1

font-0 = "monospace:size=9;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=9;2"

modules-left = xworkspaces xwindow
modules-center = 
modules-right = backlight pulseaudio mic battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; -----------------------------------------------------------------------------
; Modules
; -----------------------------------------------------------------------------

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.foreground-alt}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>

label-charging = charging %percentage%%
label-discharging = battery %percentage%% (%state%)
label-discharging-foreground = ${colors.foreground-alt}
label-full = battery 100%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

; -----------------------------------------------------------------------------
; Audio Volume Module
; -----------------------------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false
interval = 5

format-volume = <label-volume>
label-volume = vol %percentage%%
label-volume-foreground = ${colors.foreground}

format-muted = <label-muted>
label-muted = vol muted
label-muted-foreground = ${colors.alert}

; -----------------------------------------------------------------------------
; Microphone Status Module
; -----------------------------------------------------------------------------
[module/mic]
type = custom/script
exec = sh -c 'pactl get-source-mute @DEFAULT_SOURCE@ | grep -q "yes" && echo "mic muted" || echo "mic on"'
interval = 1
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
label-foreground = ${colors.foreground-alt}

; -----------------------------------------------------------------------------
; Screen Brightness Module
; -----------------------------------------------------------------------------
[module/backlight]
type = internal/backlight

; Auto-detect brightness control interface
card = intel_backlight
use-actual-brightness = true
poll-interval = 0

format = <label>
label = bright %percentage%%
label-foreground = ${colors.foreground-alt}
