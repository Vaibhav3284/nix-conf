# =============================================================================
# Alacritty Minimalist Dark Configuration
# =============================================================================

[window]
# Remove window decorations (title bar, extra borders)
decorations = "None"
opacity = 1.0
blur = false

# Compact padding to match the clean aesthetic
padding = { x = 12, y = 12 }
dynamic_padding = false

[font]
size = 9.5

[font.normal]
family = "monospace"
style = "Regular"

[font.bold]
family = "monospace"
style = "Bold"

# -----------------------------------------------------------------------------
# Pure Pitch Black Color Scheme
# -----------------------------------------------------------------------------
[colors.primary]
background = "#000000"
foreground = "#d0d0d0"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.normal]
black   = "#000000"
red     = "#ac4142"
green   = "#90a959"
yellow  = "#f4bf75"
blue    = "#6a9fb5"
magenta = "#aa759f"
cyan    = "#75b5aa"
white   = "#d0d0d0"

[colors.bright]
black   = "#505050"
red     = "#ac4142"
green   = "#90a959"
yellow  = "#f4bf75"
blue    = "#6a9fb5"
magenta = "#aa759f"
cyan    = "#75b5aa"
white   = "#f5f5f5"

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000
